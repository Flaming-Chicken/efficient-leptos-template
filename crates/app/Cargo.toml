[package]
name = "app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Universal Leptos UI application, components, state management, and views"

[dependencies]
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shared = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
web-sys = { workspace = true }
spodeian-cache = { workspace = true }
spodeian-tokens = { workspace = true }
spodeian-web-utils = { workspace = true }
spodeian-export = { workspace = true }
spodeian-telemetry = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

# Exactly one rendering mode per build; there is deliberately no default.
# ssr: server/static rendering (ssg binary) · hydrate: web release · csr: desktop (Trunk)
[features]
ssr = ["leptos/ssr", "leptos_router/ssr", "leptos_meta/ssr"]
hydrate = ["leptos/hydrate"]
csr = ["leptos/csr"]


[dev-dependencies]
pollster = { workspace = true }
