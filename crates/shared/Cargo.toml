[package]
name = "shared"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core business models, serialization, state management, and export logic"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
spodeian-tokens = { workspace = true }
spodeian-export = { workspace = true }

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "thiserror/std"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "serialization_benchmarks"
harness = false

