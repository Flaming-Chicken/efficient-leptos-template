<!DOCTYPE html>
<!-- Desktop (Tauri) entry page, built by Trunk with client-side rendering. The web
     release is pre-rendered by the `ssg` binary instead; its page shell lives in
     crates/app/src/shell.rs. Keep the two in step. -->
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Modern, high-performance Serverless WebAssembly & Native Desktop application built with Rust and Leptos 0.8" />

    <!-- Theme initialization (prevents a flash of the wrong theme). Inline on purpose:
         it must run before first paint. Allowed by hash in the CSP. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('serverless_leptos_theme');
                if (t === 'light' || t === 'high-contrast-dark' || t === 'high-contrast-light') {
                    document.documentElement.setAttribute('data-theme', t);
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <title>Leptos Serverless & Desktop Template</title>

    <!-- wasm-opt must accept every WebAssembly feature enabled in .cargo/config.toml. -->
    <link
        data-trunk
        rel="rust"
        href="Cargo.toml"
        data-type="main"
        data-cargo-features="csr"
        data-cargo-no-default-features
        data-wasm-opt="z"
        data-wasm-opt-params="--enable-simd --enable-bulk-memory --enable-mutable-globals --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --strip-debug --strip-producers"
    />
    <link data-trunk rel="scss" href="style.scss" />
    <link data-trunk rel="copy-dir" href="public" data-target-path="." />
    <script src="/pwa.js" defer></script>
    <script src="/storage-bridge.js" defer></script>
</head>
<body>
    <noscript>
        <div style="padding: 2rem; text-align: center;">
            <h2>JavaScript Required</h2>
            <p>The desktop app needs JavaScript and WebAssembly enabled.</p>
        </div>
    </noscript>
</body>
</html>
