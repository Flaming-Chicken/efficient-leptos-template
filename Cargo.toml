[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/shared",
    "crates/desktop",
    "crates/web",
]

# Shared metadata for all workspace packages
[workspace.package]
version = "0.1.0"
authors = ["Liam <spodeian@proton.me>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Modern, modular Serverless (WASM/Cloudflare Pages/PWA) & Native Desktop template built with Rust and Leptos"
repository = "https://github.com/Spodeian/efficient-leptos-template"

[workspace.dependencies]
leptos = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "tracing-log"] }
tracing-web = "0.1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlDocument",
    "Location",
    "Navigator",
    "Clipboard",
    "KeyboardEvent",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
bson = "2"
miniz_oxide = "0.8"
base64 = "0.22"
shared = { path = "crates/shared" }
app = { path = "crates/app" }
tauri = { version = "2", features = ["config-toml"] }
tauri-build = { version = "2", features = ["config-toml"] }
spodeian-cache = { path = "../spodeian-core/crates/spodeian-cache", version = "^1.0.0" }
spodeian-tokens = { path = "../spodeian-core/crates/spodeian-tokens", version = "^1.0.0" }
spodeian-telemetry = { path = "../spodeian-core/crates/spodeian-telemetry", version = "^1.0.0" }
spodeian-export = { path = "../spodeian-core/crates/spodeian-export", version = "^1.0.0" }
spodeian-web-utils = { path = "../spodeian-core/crates/spodeian-web-utils", version = "^1.0.0" }



[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
incremental = false
rpath = false

[profile.release.build-override]
opt-level = 2
codegen-units = 256

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
overflow-checks = false
incremental = false

[profile.dev]
opt-level = 0
codegen-units = 256
debug = true

[profile.dev.build-override]
opt-level = 2
overflow-checks = false

[profile.test]
opt-level = 2
lto = "thin"
debug = true
