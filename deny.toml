# cargo-deny configuration. CI runs `cargo deny check licenses`.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # This workspace's own crates and other spodeian-core git dependencies.
    "PolyForm-Noncommercial-1.0.0",
]
