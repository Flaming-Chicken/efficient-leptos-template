# Deploys the pre-rendered web release (static HTML + hydration bundle) to GitHub Pages and Cloudflare Workers.
# The site is built for the root path "/": use a user/organisation site or a custom domain.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure Private Git Auth (Optional)
        env:
          SPODEIAN_GIT_TOKEN: ${{ secrets.SPODEIAN_CORE_TOKEN || secrets.PRIVATE_READ_ACCESS || secrets.GH_PAT }}
        run: |
          if [ -n "$SPODEIAN_GIT_TOKEN" ]; then
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
            git config --global url."https://x-access-token:${SPODEIAN_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      # scripts/build-web.sh pins cargo-leptos (and through it Sass and wasm-opt) and
      # installs the wasm-bindgen CLI at the version in Cargo.lock.
      - name: Cache Build Tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-leptos
            ~/.cargo/bin/wasm-bindgen
            ~/.cache/cargo-leptos
          key: ${{ runner.os }}-web-tools-${{ hashFiles('scripts/build-web.sh', 'Cargo.lock') }}

      - name: Build Pre-rendered Web Release
        run: bash scripts/build-web.sh

      - name: Setup Pages
        id: setup-pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Upload compiled assets artifact (Pages)
        if: steps.setup-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'target/site'

      - name: Upload compiled assets artifact (Fallback for Private Repo)
        if: steps.setup-pages.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: 'target/site'
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: steps.setup-pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Deploy to Cloudflare Workers
        if: github.repository_owner == 'Spodeian' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
